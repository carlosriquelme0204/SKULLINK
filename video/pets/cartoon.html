<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>SKULL.INK — Novos Pets</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  svg{display:block}
  .o{stroke:#0a0a0a;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
  .t{font-family:'Inter Display','Inter',sans-serif;font-weight:900;paint-order:stroke;stroke:#0a0a0a;stroke-linejoin:round}
  .m{font-family:'JetBrains Mono',monospace;font-weight:800}
</style></head><body>
<svg id="V" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script src="pets.js"></script>
<script>
// ============ utilitários ============
const W=1280,H=720,FPS=30,DUR=49.5;
const E={lin:x=>x,out:x=>1-(1-x)**3,in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,back:x=>{const c=1.9;return 1+(c+1)*(x-1)**3+c*(x-1)**2},
  bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}};
const k=(t,t0,t1,a,b,e=E.io)=>t<=t0?a:t>=t1?b:a+(b-a)*e((t-t0)/(t1-t0));
const seg=(t,t0,t1)=>Math.max(0,Math.min(1,(t-t0)/(t1-t0)));
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const EL={};const $=id=>EL[id]||(EL[id]=document.getElementById(id));
function S(id,o){const e=$(id);if(!e)return;if('x'in o||'y'in o||'r'in o||'s'in o||'sx'in o){const s=o.s??1;e.setAttribute('transform',`translate(${(o.x??0).toFixed(1)} ${(o.y??0).toFixed(1)}) rotate(${(o.r??0).toFixed(2)}) scale(${(o.sx??s).toFixed(3)} ${(o.sy??s).toFixed(3)})`);}
  if('o'in o)e.setAttribute('opacity',Math.max(0,Math.min(1,o.o)).toFixed(3));if('d'in o)e.style.display=o.d?'':'none';}
const C={ink:'#0a0a0a',bone:'#efece4',red:'#c4161c',pink:'#ff4fb8',cyan:'#22e6ff',yel:'#ffd23a',pur:'#8a4aff',grn:'#2ad06a',org:'#ff7a1a'};
const spiral=r=>{let d='';for(let a=0;a<Math.PI*6;a+=0.25){const q=r*a/(Math.PI*6);d+=(d?'L':'M')+(Math.cos(a)*q).toFixed(1)+' '+(Math.sin(a)*q).toFixed(1);}return d;};

// ============ personagens ============
function skull(p){const sp=[-56,-28,0,28,56].map(a=>`<g transform="translate(0 -50) rotate(${a}) translate(0 -54)"><path class="o" fill="#9aa0aa" d="M-9 4 L0 -26 L9 4Z"/></g>`).join('');
  const leg=(id,x)=>`<g id="${p}-${id}" transform="translate(${x} 0)"><rect class="o" x="-11" y="-4" width="22" height="48" rx="8" fill="#141416"/><path class="o" fill="#141416" d="M-14 42 h24 q10 0 10 10 h-34z"/><rect class="o" x="-15" y="50" width="36" height="7" rx="3" fill="#efece4"/></g>`;
  const arm=(id,x)=>`<g id="${p}-${id}" transform="translate(${x} -78)"><rect class="o" x="-9" y="-4" width="18" height="48" rx="8" fill="#141416"/><circle class="o" cx="0" cy="50" r="11" fill="#efece4"/></g>`;
  return `<g id="${p}">${leg('legL',-14)}${leg('legR',14)}${arm('armL',-38)}
  <path class="o" fill="#efece4" d="M-36 -88 Q0 -98 36 -88 L40 -4 Q0 4 -40 -4Z"/><rect class="o" x="-42" y="-10" width="84" height="11" rx="5" fill="#efece4"/>
  <path fill="#0a0a0a" d="M0 -74 l-11 -8 l5 13 l-9 3 l15 2 l0 13 l0 -13 l15 -2 l-9 -3 l5 -13z"/>
  ${arm('armR',38)}
  <g id="${p}-head" transform="translate(0 -92)">${sp}
    <path class="o" fill="#efece4" d="M-34 -16 Q-38 16 -14 18 L14 18 Q38 16 34 -16Z"/><circle class="o" cx="0" cy="-50" r="58" fill="#efece4"/>
    <path fill="#0a0a0a" d="M-7 -24 L7 -24 L0 -13Z"/>
    <g transform="translate(-24 -54)"><path stroke="#0a0a0a" stroke-width="8" stroke-linecap="round" d="M-13 -13 L13 13 M13 -13 L-13 13"/><path stroke="#0a0a0a" stroke-width="3" d="M-9 -1 l-6 -6 M1 9 l-6 -6 M-1 -9 l6 6 M9 1 l6 6"/></g>
    <g transform="translate(24 -54)"><circle r="20" fill="#0a0a0a"/><g id="${p}-sp"><path d="${spiral(17)}" stroke="#efece4" stroke-width="3.2" fill="none"/></g></g>
    <path id="${p}-lid" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round" fill="none" d="M2 -74 Q24 -66 46 -74"/>
    <g id="${p}-mB"><path stroke="#0a0a0a" stroke-width="4" d="M-22 2 H22"/><path stroke="#0a0a0a" stroke-width="3" d="M-14 -4 v12 M-5 -4 v12 M5 -4 v12 M14 -4 v12"/></g>
    <g id="${p}-mG" opacity="0"><path class="o" fill="#0a0a0a" d="M-28 -6 Q0 26 28 -6Z"/><path fill="#efece4" d="M-22 -4 H22 L19 2 H-19Z"/></g>
  </g></g>`;}
function pet(p,id,flip){return `<g id="${p}"><g transform="scale(${flip?-1:1} 1) translate(-60 -116)">${PETSVG[id]}</g></g>`;}
function bandit(p,shirt='#6a6f7a'){const leg=(id,x)=>`<g id="${p}-${id}" transform="translate(${x} 0)"><rect class="o" x="-11" y="-4" width="22" height="46" rx="6" fill="#2a2f45"/><path class="o" fill="#0a0a0a" d="M-13 40 h22 q10 0 10 9 h-32z"/></g>`;
  const arm=(id,x)=>`<g id="${p}-${id}" transform="translate(${x} -74)"><rect class="o" x="-9" y="-4" width="18" height="46" rx="7" fill="${shirt}"/><circle class="o" cx="0" cy="46" r="10" fill="#e8b48a"/></g>`;
  return `<g id="${p}">${leg('legL',-13)}${leg('legR',13)}${arm('armL',-36)}<path class="o" fill="${shirt}" d="M-34 -84 Q0 -92 34 -84 L36 -2 L-36 -2Z"/>${arm('armR',36)}
  <g id="${p}-head" transform="translate(0 -88)"><circle class="o" cx="0" cy="-30" r="32" fill="#e8b48a"/><path class="o" fill="#141416" d="M-33 -36 Q-30 -70 0 -70 Q30 -70 33 -36Z"/><circle class="o" cx="0" cy="-72" r="7" fill="#c4161c"/>
    <path class="o" fill="#c4161c" d="M-31 -22 Q0 -14 31 -22 L28 -4 Q0 6 -28 -4Z"/>
    <g id="${p}-eA"><path stroke="#0a0a0a" stroke-width="4" d="M-20 -40 L-6 -35 M20 -40 L6 -35"/><circle cx="-12" cy="-30" r="4"/><circle cx="12" cy="-30" r="4"/></g>
    <g id="${p}-eS" opacity="0"><circle class="o" cx="-12" cy="-31" r="9" fill="#fff"/><circle class="o" cx="12" cy="-31" r="9" fill="#fff"/><circle cx="-12" cy="-31" r="2.5"/><circle cx="12" cy="-31" r="2.5"/><path fill="#7fd4ff" d="M30 -44 q6 10 0 14 q-6 -4 0 -14z" class="o"/></g>
    <g id="${p}-eX" opacity="0"><path stroke="#0a0a0a" stroke-width="4" d="M-18 -36 l10 10 M-8 -36 l-10 10 M8 -36 l10 10 M18 -36 l-10 10"/></g></g></g>`;}
function nina(p){return `<g id="${p}"><path class="o" fill="#ff8ac8" d="M-60 0 Q-58 -80 0 -84 Q58 -80 60 0Z"/><path class="o" fill="#2ad06a" d="M-36 0 L-32 -66 Q0 -60 32 -66 L36 0Z"/>
  <g transform="translate(0 -36) scale(.8)"><circle cx="0" cy="6" r="10" fill="#0a0a0a"/><circle cx="-11" cy="-8" r="5" fill="#0a0a0a"/><circle cx="-4" cy="-14" r="5" fill="#0a0a0a"/><circle cx="4" cy="-14" r="5" fill="#0a0a0a"/><circle cx="11" cy="-8" r="5" fill="#0a0a0a"/></g>
  <g id="${p}-head" transform="translate(0 -88)"><circle class="o" cx="0" cy="-62" r="26" fill="#2ad06a"/><circle class="o" cx="0" cy="-26" r="38" fill="#f2c9a0"/>
    <path class="o" fill="#2ad06a" d="M-40 -24 Q-44 -70 0 -66 Q44 -70 40 -24 Q30 -50 0 -46 Q-26 -50 -40 -24Z"/>
    <g id="${p}-eN"><circle cx="-14" cy="-24" r="4.5"/><circle cx="14" cy="-24" r="4.5"/></g>
    <g id="${p}-eW" opacity="0"><circle class="o" cx="-15" cy="-26" r="13" fill="#fff"/><circle class="o" cx="15" cy="-26" r="13" fill="#fff"/><circle cx="-15" cy="-26" r="3"/><circle cx="15" cy="-26" r="3"/></g>
    <path id="${p}-mS" stroke="#0a0a0a" stroke-width="4" fill="none" stroke-linecap="round" d="M-12 -4 Q0 6 12 -4"/>
    <ellipse id="${p}-mO" class="o" cx="0" cy="0" rx="9" ry="13" fill="#7a1010" opacity="0"/><circle cx="-24" cy="-12" r="6" fill="#ff8ac8" opacity=".6"/><circle cx="24" cy="-12" r="6" fill="#ff8ac8" opacity=".6"/></g></g>`;}
function sticker(id,txt,col,size,rot=0,shadow=C.red){return `<g id="${id}" opacity="0"><g transform="rotate(${rot})"><text class="t" text-anchor="middle" font-size="${size}" x="6" y="6" fill="${shadow}" stroke-width="${size/6}">${txt}</text><text class="t" text-anchor="middle" font-size="${size}" fill="${col}" stroke-width="${size/6}">${txt}</text></g></g>`;}
function phone(id,l1,l2,l3){return `<g id="${id}" opacity="0"><rect class="o" x="-150" y="-260" width="300" height="520" rx="40" fill="#141416" stroke-width="6"/><rect x="-132" y="-236" width="264" height="472" rx="26" fill="#2a0f4a"/>
  <rect x="-40" y="-252" width="80" height="12" rx="6" fill="#0a0a0a"/><text class="m" x="-112" y="-200" fill="#efece4" font-size="22">23:41</text>
  <g id="${id}-card"><rect class="o" x="-118" y="-150" width="236" height="180" rx="18" fill="#efece4"/><text class="m" x="-100" y="-118" font-size="16" fill="#c4161c">SKULL.INK · ALERTA</text>
  <text class="t" x="0" y="-72" text-anchor="middle" font-size="30" fill="${C.yel}" stroke-width="5">${l1}</text><text class="t" x="0" y="-32" text-anchor="middle" font-size="22" fill="#0a0a0a" stroke-width="0">${l2}</text><text class="m" x="0" y="0" text-anchor="middle" font-size="17" fill="#0a0a0a">${l3}</text></g></g>`;}
function skyline(sd,y,n,w,hMin,hMax,dark){seed=sd;let o='',x=-40;for(let i=0;i<n;i++){const bw=90+rnd()*110,bh=hMin+rnd()*(hMax-hMin);o+=`<rect x="${x}" y="${y-bh}" width="${bw}" height="${bh+400}" fill="${dark[i%dark.length]}" stroke="#0a0a0a" stroke-width="3"/>`;
  for(let wy=y-bh+22;wy<y-14;wy+=34)for(let wx=x+14;wx<x+bw-20;wx+=26)if(rnd()<0.34)o+=`<rect x="${wx}" y="${wy}" width="14" height="20" fill="${[C.pink,C.cyan,C.yel,C.org][rnd()*4|0]}"/>`;
  if(rnd()<0.3)o+=`<rect x="${x+bw/2-14}" y="${y-bh-60}" width="28" height="60" fill="${[C.grn,C.pink,C.cyan][rnd()*3|0]}" stroke="#0a0a0a" stroke-width="3"/>`;x+=bw+4;}return o;}
function lanterns(id,x1,x2,y,sag,n){let o=`<g id="${id}"><path d="M${x1} ${y} Q${(x1+x2)/2} ${y+sag*2} ${x2} ${y}" stroke="#0a0a0a" stroke-width="3" fill="none"/>`;
  for(let i=1;i<n;i++){const u=i/n,x=x1+(x2-x1)*u,yy=y+sag*2*2*u*(1-u);o+=`<circle cx="${x}" cy="${yy+14}" r="22" fill="#ff3a3a" opacity=".25"/><rect class="o" x="${x-10}" y="${yy+2}" width="20" height="26" rx="8" fill="#e0242a" stroke-width="3"/>`;}return o+'</g>';}
const stars=n=>{seed=3;let o='';for(let i=0;i<n;i++)o+=`<circle cx="${rnd()*W}" cy="${rnd()*H*0.6}" r="${1+rnd()*2}" fill="#fff" opacity="${0.4+rnd()*0.6}"/>`;return o;};
const SKY=`<rect width="${W}" height="${H}" fill="url(#sky)"/>${stars(70)}<circle cx="1080" cy="120" r="54" fill="#fff6d6" opacity=".9"/><circle cx="1062" cy="110" r="10" fill="#e8dcb0"/><circle cx="1098" cy="134" r="7" fill="#e8dcb0"/>`;
const burst=(id,col)=>{let o=`<g id="${id}" opacity="0"><rect x="-1000" y="-1000" width="2000" height="2000" fill="${col}"/>`;for(let i=0;i<20;i++){const a=i/20*Math.PI*2,b=a+0.16;o+=`<path d="M0 0 L${Math.cos(a)*1500} ${Math.sin(a)*1500} L${Math.cos(b)*1500} ${Math.sin(b)*1500}Z" fill="#fff" opacity=".18"/>`;}return o+'</g>';};
const speed=(id,col='#fff')=>{seed=9;let o=`<g id="${id}" opacity="0">`;for(let i=0;i<22;i++){const y=rnd()*H,x=rnd()*W;o+=`<rect x="${x}" y="${y}" width="${120+rnd()*260}" height="${3+rnd()*4}" rx="3" fill="${col}" opacity=".55"/>`;}return o+'</g>';};
const puffs=(id,col='#efece4')=>`<g id="${id}" opacity="0">${[[-50,0,26],[-20,-14,32],[20,-12,30],[52,2,24],[0,4,28]].map(([x,y,r])=>`<circle class="o" cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`).join('')}</g>`;
const coin=i=>`<g id="coin${i}" opacity="0"><ellipse class="o" rx="20" ry="20" fill="#ffd23a"/><text class="t" text-anchor="middle" y="9" font-size="24" fill="#c98a00" stroke-width="0">☠</text></g>`;

// ============ cenas ============
const PO=['bunny','cat','parrot','panda','jaguar','dragon'],PN={bunny:'COELHO',cat:'GATO',parrot:'ARARA',panda:'PANDA',jaguar:'ONÇA PINTADA',dragon:'CHARIGARTO'},
  PP={bunny:'+1 PULO NO AR',cat:'ARRANHÃO',parrot:'ESQUIVA VIRA VOO',panda:'KARATÊ NA HORA',jaguar:'BOTE CERTEIRO',dragon:'BAFO DE FOGO'},PC={bunny:C.bone,cat:'#5a5a66',parrot:'#2a6aff',panda:C.red,jaguar:C.org,dragon:'#ff5a1a'};
const V=$('V');
V.innerHTML=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14062a"/><stop offset=".7" stop-color="#3a1460"/><stop offset="1" stop-color="#6a2a6a"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3a0"/><stop offset=".35" stop-color="#ffb21a"/><stop offset=".75" stop-color="#ff5a1a"/><stop offset="1" stop-color="#c4161c" stop-opacity="0"/></linearGradient>
  <filter id="boil"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
  <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.3" fill="#000"/></pattern></defs>
<g id="cam"><g filter="url(#boil)">
<!-- CENA 1: telhado -->
<g id="s1">${SKY}<g id="s1w">${skyline(11,820,14,0,120,520,['#1e1238','#2a1648','#180e2e'])}
  <rect class="o" x="300" y="390" width="480" height="1200" fill="#231340"/><rect class="o" x="286" y="376" width="508" height="22" fill="#3a2060"/>
  ${(()=>{seed=4;let o='';for(let y=440;y<1500;y+=60)for(let x=330;x<760;x+=54)if(rnd()<0.45)o+=`<rect x="${x}" y="${y}" width="28" height="36" fill="${[C.pink,C.cyan,C.yel][rnd()*3|0]}"/>`;return o;})()}
  <rect class="o" x="790" y="860" width="60" height="200" fill="${C.pink}"/><text class="t" x="820" y="950" text-anchor="middle" font-size="34" fill="#fff" stroke-width="4" transform="rotate(90 820 950)">BAR</text>
  ${lanterns('lan1',0,1280,1180,60,12)}${lanterns('lan2',-100,1380,1300,70,14)}
  <g transform="translate(520 386) scale(1.6)">${skull('k1')}</g>
  ${sticker('dots1','...',C.bone,54,0)}${sticker('vr1','VRRR! VRRR!',C.yel,64,-8)}</g>
  ${phone('ph1','NOVIDADE!','Nova loja de pets!','Pet Shop da Nina 🐾')}
  <g id="s1close" opacity="0"><rect width="${W}" height="${H}" fill="#2a0f4a"/>${burst('bz1',C.pur)}<g id="k1c">${skull('k1b')}</g>${sticker('ex1','!!!',C.yel,120,10)}</g></g>
<!-- CENA 2: parkour -->
<g id="s2">${SKY}<g id="s2far">${skyline(21,720,40,0,180,420,['#1a0f30','#24143e'])}</g>
  <g id="s2near">${(()=>{let o='';const R=[[0,420,520],[640,470,560],[1320,430,600],[2700,520,620],[3420,560,900]];for(const [x,y,w] of R)o+=`<rect class="o" x="${x}" y="${y}" width="${w}" height="600" fill="#2d1850"/><rect class="o" x="${x-10}" y="${y-14}" width="${w+20}" height="18" fill="#4a2a78"/>`;
    o+=`<g transform="translate(1180 330)"><rect class="o" x="-70" y="-40" width="140" height="80" rx="10" fill="${C.cyan}"/><text class="t" text-anchor="middle" y="18" font-size="48" fill="#fff" stroke-width="5">24H</text></g>`;
    o+=lanterns('lan3',1920,2700,520,50,9);
    o+=`<g transform="translate(3420 560)"><rect class="o" x="0" y="-260" width="560" height="260" fill="#10201a"/><rect class="o" x="40" y="-240" width="400" height="70" fill="#04140c"/><text class="t" x="240" y="-192" text-anchor="middle" font-size="40" fill="#bfffd6" stroke-width="3">PET SHOP DA NINA</text>
      <g transform="translate(500 -205)" fill="${C.yel}"><ellipse cx="0" cy="8" rx="20" ry="16"/><circle cx="-18" cy="-12" r="7"/><circle cx="-6" cy="-22" r="7"/><circle cx="6" cy="-22" r="7"/><circle cx="18" cy="-12" r="7"/></g>
      <rect class="o" x="40" y="-150" width="300" height="140" fill="#cfffe2"/><rect class="o" x="380" y="-160" width="110" height="160" fill="#2ad06a"/></g>`;return o;})()}</g>
  <g id="rope" opacity="0"><line id="ropeL" x1="0" y1="0" x2="0" y2="0" stroke="#0a0a0a" stroke-width="5"/></g>
  <g id="k2w">${skull('k2')}</g>${puffs('pf2')}${speed('sp2')}
  ${sticker('st2a','WIIII!',C.cyan,60,-10)}${sticker('st2b','SWING!',C.pink,60,8)}${sticker('st2c','POF!',C.yel,80,-6)}</g>
<!-- CENA 3: loja -->
<g id="s3"><rect width="${W}" height="${H}" fill="#0f2a1e"/>
  ${(()=>{let o='';for(let r=0;r<2;r++){o+=`<rect class="o" x="60" y="${140+r*170}" width="1160" height="16" fill="#6a4426"/>`;for(let i=0;i<6;i++){const x=130+i*190,y=140+r*170;o+=`<rect class="o" x="${x-60}" y="${y-130}" width="120" height="130" fill="#173a2a"/>${(r+i)%2?'':`<g transform="translate(${x} ${y-8}) scale(.8)">${PETSVG[PO[(i+r*3)%6]].replace(/<svg[^>]*>|<\/svg>/g,'')}</g>`.replace('scale(.8)">','scale(.8) translate(-60 -116)">')}`;for(let b=0;b<6;b++)o+=`<rect x="${x-56+b*22}" y="${y-128}" width="5" height="126" fill="#c8ccd6"/>`;}}return o;})()}
  <g id="nina" transform="translate(860 520)">${nina('n1')}</g>
  <rect class="o" x="560" y="500" width="700" height="240" fill="#6a4426"/><rect class="o" x="550" y="488" width="720" height="22" fill="#2ad06a"/><rect class="o" x="1110" y="430" width="90" height="60" rx="6" fill="#141416"/><rect x="1122" y="442" width="66" height="22" fill="${C.grn}"/>
  <g id="k3w">${skull('k3')}</g><g id="bag" opacity="0"><path class="o" fill="#c9a060" d="M-40 0 Q-50 -60 0 -64 Q50 -60 40 0Z"/><text class="t" text-anchor="middle" y="-18" font-size="36" fill="${C.yel}" stroke-width="5">☠</text></g>
  ${Array.from({length:14},(_,i)=>coin(i)).join('')}
  <g id="carry">${['bunny','parrot','cat'].map((id,i)=>`<g id="cr${i}">${pet('crp'+i,id)}</g>`).join('')}</g>
  ${sticker('cl1','CLANG!',C.yel,62,-12)}${sticker('cl2','CLANG!',C.yel,62,8)}${sticker('cl3','CLANG!!',C.yel,76,-4)}${sticker('st3','TCHAU, NINA!',C.bone,46,-4)}
  <g id="bub3" opacity="0"><path class="o" fill="#efece4" d="M-150 -60 H150 Q166 -60 166 -44 V20 Q166 36 150 36 H30 L10 66 L0 36 H-150 Q-166 36 -166 20 V-44 Q-166 -60 -150 -60Z"/><text class="m" text-anchor="middle" y="-6" font-size="24">Oiê! Qual vai ser?</text></g></g>
<!-- CENA 4: apresentação -->
<g id="s4"><rect width="${W}" height="${H}" fill="url(#sky)"/>${skyline(31,560,16,0,140,360,['#1e1238','#2a1648'])}<rect class="o" x="-10" y="560" width="1300" height="200" fill="#2a1e30"/><rect x="0" y="620" width="1280" height="10" fill="${C.yel}" opacity=".6"/>
  ${[150,320,960,1130,250].map((x,i)=>`<g id="bw${i}" transform="translate(${x} ${i===4?600:640})">${bandit('b4'+i,['#6a6f7a','#4a5a8a','#7a4a6a','#5a6a5a','#6a6f7a'][i])}</g>`).join('')}
